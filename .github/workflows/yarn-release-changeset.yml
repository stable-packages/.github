name: yarn-release-changeset
# changesets/action opens the "version packages" PR with the built-in GITHUB_TOKEN.
# github-actions[bot] therefore opens and pushes it, and GitHub creates the PR's
# `on: pull_request` runs (CI, CodeQL) but parks them as `action_required` until someone
# approves them. A ruleset that requires their checks leaves the PR blocked. So after
# changesets/action opens or updates the PR, this job finds the parked runs on the branch
# head, waiting up to about 60s for GitHub to create them, and approves each one
# (`POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve`). The runs then execute
# against the PR, so every required check reports, CodeQL's code-scanning result
# included. The previous approach dispatched CI with `workflow_dispatch`, which satisfied
# the CI check but never produced the CodeQL result. A GitHub App token would also work,
# but it means a long-lived private key in org secrets; this needs no stored secret.
#
# The caller must grant `actions: write` to the job that calls this workflow, for the
# approval. Without it the release still succeeds, but with a warning and a PR whose runs
# stay pending. Callers no longer need `workflow_dispatch:` in their CI workflow's `on:`
# block (the previous approach dispatched it). Leaving it there is harmless.
on:
  workflow_call:
    inputs:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: yarn

      - name: Install Dependencies
        run: yarn
      - run: yarn build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: version packages'
          version: yarn version
          publish: yarn changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # github-actions[bot] opens and pushes the version PR, so GitHub parks the PR's
      # pull_request runs (CI, CodeQL) as action_required until someone approves them.
      # Approve them so they run against the PR; see the header. A failed approval warns
      # rather than failing an otherwise good release.
      - name: Approve the version packages PR's pending runs
        if: steps.changesets.outputs.pullRequestNumber != '' && steps.changesets.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          grant="Grant 'actions: write' in the caller's 'permissions:' for the job that calls this workflow."
          if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$VERSION_BRANCH" --jq .object.sha 2>&1); then
            echo "$sha"
            echo "::warning::Could not read the head of $VERSION_BRANCH, so the version packages PR's runs stay pending approval and its required checks never report."
            exit 0
          fi
          list() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$VERSION_BRANCH&head_sha=$sha&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "action_required" or .status == "action_required" or .status == "waiting") | .id'
          }
          # GitHub creates the PR's runs a few seconds after the push. Poll for up to
          # about 60s, then list once more to catch workflows created a beat later.
          ids=""
          for _ in $(seq 1 12); do
            if ! ids=$(list 2>&1); then
              echo "$ids"
              echo "::warning::Could not list the runs on $VERSION_BRANCH, so the version packages PR's runs stay pending approval and its required checks never report. $grant"
              exit 0
            fi
            [ -n "$ids" ] && break
            sleep 5
          done
          sleep 5
          if more=$(list 2>/dev/null); then ids=$more; fi
          if [ -z "$ids" ]; then
            echo "::warning::No runs on $VERSION_BRANCH at $sha were waiting for approval after 60s. If the version packages PR is still blocked, approve its runs from the Actions tab."
            exit 0
          fi
          for id in $ids; do
            if out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" 2>&1); then
              echo "Approved run $id"
            elif grep -qiE '403|Resource not accessible' <<<"$out"; then
              echo "$out"
              echo "::warning::GITHUB_TOKEN may not approve run $id, so it stays pending and the version packages PR stays blocked. $grant"
            else
              echo "$out"
              echo "::warning::Could not approve run $id on $VERSION_BRANCH, so it stays pending and the version packages PR stays blocked. Check that the caller grants 'actions: write'."
            fi
          done

      # - name: Send a Slack notification if a publish happens
      #   if: steps.changesets.outputs.published == 'true'
      #   # You can do something when a publish happens.
      #   run: my-slack-bot send-notification --message "A new version of ${GITHUB_REPOSITORY} was published!"

name: yarn-release-changeset
# changesets/action opens the "version packages" PR with the built-in GITHUB_TOKEN.
# GitHub starts no workflows for events that token causes, so opening or pushing the PR
# does not run the caller's `on: pull_request` CI, and a ruleset that requires its checks
# leaves the PR blocked. workflow_dispatch is the one event GITHUB_TOKEN may trigger, so
# after changesets/action opens or updates the PR, this job runs
# `gh workflow run <ci-workflow> --ref changeset-release/<branch>`. The check runs from
# that dispatch attach to the branch head under the GitHub Actions app and satisfy the
# required check by name. A GitHub App token would also work, but it means a long-lived
# private key in org secrets; this needs no stored secret.
#
# The caller must:
#   - grant `actions: write` to the job that calls this workflow, for the dispatch;
#   - list `workflow_dispatch:` in the `on:` block of its CI workflow (`ci-workflow`,
#     default pull-request.yml). Without it the dispatch fails; the release still
#     succeeds, but with a warning and a PR that has no checks.
on:
  workflow_call:
    inputs:
      ci-workflow:
        description: >
          The caller's CI workflow file, dispatched on the version branch after the
          "version packages" PR is opened or updated. It must list `workflow_dispatch:`.
        type: string
        required: false
        default: pull-request.yml

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: yarn

      - name: Install Dependencies
        run: yarn
      - run: yarn build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: version packages'
          version: yarn version
          publish: yarn changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # GITHUB_TOKEN-caused events start no workflows, so the version PR would never get
      # its required checks. Dispatch the caller's CI on the version branch instead; see
      # the header. A failed dispatch warns rather than failing an otherwise good release.
      - name: Start CI on the version packages PR
        if: steps.changesets.outputs.pullRequestNumber != '' && steps.changesets.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          if ! out=$(gh workflow run "$CI_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$VERSION_BRANCH" 2>&1); then
            echo "$out"
            if grep -qi 'workflow_dispatch' <<<"$out"; then
              echo "::warning::$CI_WORKFLOW has no workflow_dispatch trigger, so the version packages PR has no checks. Add 'workflow_dispatch:' to its 'on:' block."
            else
              echo "::warning::Could not dispatch $CI_WORKFLOW on $VERSION_BRANCH, so the version packages PR has no checks. Check that the caller grants 'actions: write' and that ci-workflow names its CI workflow file."
            fi
          fi

      # - name: Send a Slack notification if a publish happens
      #   if: steps.changesets.outputs.published == 'true'
      #   # You can do something when a publish happens.
      #   run: my-slack-bot send-notification --message "A new version of ${GITHUB_REPOSITORY} was published!"

name: pnpm-release-changeset-oidc
# Secretless variant of pnpm-release-changeset.yml.
#
# Differences from that workflow:
#   - No CI_GITHUB_TOKEN. Checkout and changesets/action both use the built-in
#     GITHUB_TOKEN with the caller's grant. github-actions[bot] therefore opens and
#     pushes the "version packages" PR, and GitHub creates the PR's `on: pull_request`
#     runs (CI, CodeQL) but parks them as `action_required` until someone approves
#     them. A ruleset that requires their checks leaves the PR blocked. So after
#     changesets/action opens or updates the PR, this job finds the parked runs on the
#     branch head, waiting up to about 60s for GitHub to create them, and approves each
#     one (`POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve`). The runs then
#     execute against the PR, so every required check reports, CodeQL's code-scanning
#     result included. The previous approach dispatched CI with `workflow_dispatch`,
#     which satisfied the CI check but never produced the CodeQL result. A GitHub App
#     token would also work, but it means a long-lived private key in org secrets; this
#     needs no stored secret.
#
#     The caller must:
#       - grant `id-token: write`, `contents: write` and `pull-requests: write` to
#         the job that calls this workflow, plus `actions: write` for the approval.
#         This workflow declares no `permissions:` of its own, so the caller's grant
#         passes through unchanged. A block here would cap the token: every scope it
#         did not list, `actions` included, would drop to `none`, and the approval
#         would fail with 403 even when the caller grants `actions: write`. Listing
#         `actions: write` here instead would break every caller that does not grant
#         it, since a called workflow may not request more than its caller grants.
#         Without `actions: write` the release still succeeds, but with a warning and
#         a PR whose runs stay pending.
#
#     Callers no longer need `workflow_dispatch:` in their CI workflow's `on:` block
#     (the previous approach dispatched it). Leaving it there is harmless.
#   - No NPM_TOKEN. Publishes via npm trusted publishing (OIDC), which also emits
#     provenance attestations. Each package must have a trusted publisher registered at
#     npmjs.com/package/<name>/access naming the repo and the *caller* workflow's
#     filename (release.yml), not this file. Until that registration exists, publishing
#     fails with a 404 on PUT — npm returns 404 rather than 403 so it does not leak
#     whether the package exists.
#
# Why bother, given this org has a secret scope: the org's NPM_TOKEN was created
# 2023-05-11 and had expired silently. Nothing surfaced it — `global-store` simply
# stopped reaching the registry, and sat at 1.0.0-beta.21 while `main` moved on. That is
# the characteristic failure of a long-lived credential. OIDC credentials are minted per
# run and last minutes.
#
# NOTE ON THE ACTION VERSION: this uses changesets/action@v1 deliberately, because
# consumers here are on @changesets/cli v2. changesets/action@v2 refuses to run against
# CLI v2 outright ("Changesets CLI v2 is not supported"). If a consumer moves to CLI v3,
# it needs the v2 action, whose inputs are also renamed (version -> version-script,
# publish -> publish-script, commit -> commit-message) — the old names are silently
# ignored, so a half-done migration leaves the action running with no publish script.
on:
  workflow_call:
    inputs:
      pnpm-version:
        type: string
        required: false
        default: 9.0.6
      node-version:
        type: string
        required: false
        default: '20'
    outputs:
      published:
        description: 'Whether the release was published'
        value: ${{ jobs.release.outputs.published }}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      # No `registry-url:` on purpose. It exists only to write an auth stanza
      # (`//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`) into a temp .npmrc,
      # which this secretless workflow can never fill in. Every npm and pnpm call then
      # warns "Failed to replace env in config", and `changeset publish`'s
      # "is this version already published?" probe comes back empty, so it tries to
      # republish an existing version and dies on npm's E403.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1, newer than what Node 20 bundles.
      #
      # Pinned to 11, not latest: npm 12 changed `npm info --json` to wrap its output in
      # an array (changesets/changesets#2164). @changesets/cli 2.x reads `.versions`
      # straight off the parsed value, sees undefined, concludes every version is
      # unpublished, and republishes into E403.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Install Dependencies
        run: pnpm install

      - run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: version packages'
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # github-actions[bot] opens and pushes the version PR, so GitHub parks the PR's
      # pull_request runs (CI, CodeQL) as action_required until someone approves them.
      # Approve them so they run against the PR; see the header. A failed approval warns
      # rather than failing an otherwise good release.
      - name: Approve the version packages PR's pending runs
        if: steps.changesets.outputs.pullRequestNumber != '' && steps.changesets.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          grant="Grant 'actions: write' in the caller's 'permissions:' for the job that calls this workflow."
          if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$VERSION_BRANCH" --jq .object.sha 2>&1); then
            echo "$sha"
            echo "::warning::Could not read the head of $VERSION_BRANCH, so the version packages PR's runs stay pending approval and its required checks never report."
            exit 0
          fi
          list() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$VERSION_BRANCH&head_sha=$sha&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "action_required" or .status == "action_required" or .status == "waiting") | .id'
          }
          # GitHub creates the PR's runs a few seconds after the push. Poll for up to
          # about 60s, then list once more to catch workflows created a beat later.
          ids=""
          for _ in $(seq 1 12); do
            if ! ids=$(list 2>&1); then
              echo "$ids"
              echo "::warning::Could not list the runs on $VERSION_BRANCH, so the version packages PR's runs stay pending approval and its required checks never report. $grant"
              exit 0
            fi
            [ -n "$ids" ] && break
            sleep 5
          done
          sleep 5
          if more=$(list 2>/dev/null); then ids=$more; fi
          if [ -z "$ids" ]; then
            echo "::warning::No runs on $VERSION_BRANCH at $sha were waiting for approval after 60s. If the version packages PR is still blocked, approve its runs from the Actions tab."
            exit 0
          fi
          for id in $ids; do
            if out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" 2>&1); then
              echo "Approved run $id"
            elif grep -qiE '403|Resource not accessible' <<<"$out"; then
              echo "$out"
              echo "::warning::GITHUB_TOKEN may not approve run $id, so it stays pending and the version packages PR stays blocked. $grant"
            else
              echo "$out"
              echo "::warning::Could not approve run $id on $VERSION_BRANCH, so it stays pending and the version packages PR stays blocked. Check that the caller grants 'actions: write'."
            fi
          done
